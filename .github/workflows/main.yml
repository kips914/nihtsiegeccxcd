name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Forge 1.18 - 1.20.x требует Java 17
        distribution: 'temurin'

    - name: Setup Gradle (Force 8.7)
      uses: gradle/actions/setup-gradle@v4
      with:
        # Принудительно ставим Gradle 8.7, чтобы обойти несовместимость с Gradle 9.x
        gradle-version: '8.7'

    - name: Build with Gradle
      run: gradle build

    - name: Find Created JARs (Debug)
      run: find . -name "*.jar" -type f

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: "**/build/libs/*.jar"
        if-no-files-found: error
